<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stock-analysis 帳號</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <h1>stock-analysis</h1>
  <p class="sub">台股分析工具 · 帳號層（註冊／登入）</p>
</header>

<!-- 登入後的狀態列：SPEC 10.1 的「確認自己是誰」＋顯示名稱（SPEC 10.7） -->
<section id="whoami" class="card" hidden>
  <p id="who-text">讀取中…</p>
  <div class="row">
    <button type="button" id="btn-logout">登出</button>
  </div>
</section>

<!-- 未登入時看到的三個分頁 -->
<nav id="tabs" class="tabs">
  <button type="button" class="tab" data-panel="panel-signup">註冊</button>
  <button type="button" class="tab" data-panel="panel-login">登入</button>
  <button type="button" class="tab" data-panel="panel-recover">忘記密碼</button>
</nav>

<section id="panel-signup" class="card panel">
  <h2>註冊</h2>
  <form id="form-signup" novalidate>
    <label>Email
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label>密碼
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <label>顯示名稱
      <input type="text" name="display_name" autocomplete="nickname" required>
    </label>
    <p class="hint" id="pw-hint"></p>
    <div class="row">
      <button type="submit">建立帳號</button>
    </div>
  </form>
</section>

<section id="panel-login" class="card panel" hidden>
  <h2>登入</h2>
  <form id="form-login" novalidate>
    <label>Email
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label>密碼
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <div class="row">
      <button type="submit">登入</button>
    </div>
  </form>
</section>

<section id="panel-recover" class="card panel" hidden>
  <h2>忘記密碼</h2>
  <form id="form-recover" novalidate>
    <label>Email
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <div class="row">
      <button type="submit">寄重置連結</button>
    </div>
    <p class="hint">重置信由 Supabase 透過 SMTP 寄出；信裡的連結會帶你回這個頁面設新密碼。</p>
  </form>
</section>

<!-- 點信回來（URL 帶 type=recovery）時才出現 -->
<section id="panel-reset" class="card panel" hidden>
  <h2>設新密碼</h2>
  <form id="form-reset" novalidate>
    <label>新密碼
      <input type="password" name="password" autocomplete="new-password" required>
    </label>
    <div class="row">
      <button type="submit">套用新密碼</button>
    </div>
  </form>
</section>

<p id="msg" class="msg" role="status" aria-live="polite"></p>
<noscript><p class="msg">這個頁面需要 JavaScript（要存取 Supabase）。</p></noscript>

<footer>
  <p class="sub" id="backend-note"></p>
</footer>

<script src="config.js"></script>
<script src="config.local.js"></script>
<script src="js/auth-api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
